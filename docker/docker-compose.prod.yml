version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: adsphere-nginx
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
      - frontend
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: adsphere-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: adsphere-frontend
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: adsphere-postgres
    environment:
      POSTGRES_USER: adsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adsphere}
      POSTGRES_DB: adsphere
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adsphere']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: adsphere-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
